# This workflow is managed by gh actions-lock.
name: Performance Benchmarks

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:


permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    name: Run Benchmarks

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run translation benchmarks
        run: node benchmarks/translation-bench.js > bench-translation.txt

      - name: Run comparison benchmarks
        run: node benchmarks/comparison-bench.js > bench-comparison.txt

      - name: Combine benchmark results
        run: |
          echo "# Benchmark Results" > benchmark-results.md
          echo "" >> benchmark-results.md
          echo "## Translation Benchmarks" >> benchmark-results.md
          echo "\`\`\`" >> benchmark-results.md
          cat bench-translation.txt >> benchmark-results.md
          echo "\`\`\`" >> benchmark-results.md
          echo "" >> benchmark-results.md
          echo "## Configuration Comparison" >> benchmark-results.md
          echo "\`\`\`" >> benchmark-results.md
          cat bench-comparison.txt >> benchmark-results.md
          echo "\`\`\`" >> benchmark-results.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results
          path: |
            benchmark-results.md
            bench-translation.txt
            bench-comparison.txt

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('benchmark-results.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: results
            });

      - name: Performance regression check
        if: github.event_name == 'pull_request'
        run: |
          # This is a placeholder for more sophisticated regression checking
          echo "Performance regression check would run here"
          echo "Compare current benchmarks with base branch"
