# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: Test Before Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Bun version
        run: bun --version
      - name: Test
        run: |
          if [ -f package.json ]; then
            bun install --frozen-lockfile
            bun test
          else
            echo "No root package.json; bun runtime smoke only"
            bun --eval 'console.log("bun ok", Bun.version)'
          fi

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
