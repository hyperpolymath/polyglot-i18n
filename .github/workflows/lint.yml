name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]


permissions:
  actions: read
  contents: read

jobs:
  eslint:
    name: ESLint

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint i18n.js index.js test/ examples/ tools/ --max-warnings=0

      - name: Run ESLint with formatter
        if: failure()
        run: npx eslint i18n.js index.js test/ examples/ tools/ --format=json --output-file=eslint-report.json

      - name: Upload ESLint report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: eslint-report
          path: eslint-report.json

  prettier:
    name: Prettier

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "**/*.{js,json,md,yml,yaml}"
