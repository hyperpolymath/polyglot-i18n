# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  actions: read
  contents: read

jobs:
  eslint:
    name: ESLint

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Run ESLint
        run: |
          if [ ! -f package.json ]; then
            echo "No root package.json; skip ESLint (npm-avoidant, bun-port)"
            exit 0
          fi
          bun install --frozen-lockfile
          bunx eslint i18n.js index.js test/ examples/ tools/ --max-warnings=0

  prettier:
    name: Prettier

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Check formatting
        run: |
          if [ ! -f package.json ]; then
            echo "No root package.json; skip Prettier (npm-avoidant, bun-port)"
            exit 0
          fi
          bun install --frozen-lockfile
          bunx prettier --check "**/*.{js,json,md,yml,yaml}"
